name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings

# Third-party actions are pinned to full commit SHAs. Dependabot keeps them current.
jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --all-features --locked
      - run: cargo test --workspace --all-features --doc --locked
      - name: Docs build without warnings
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Benchmarks compile
        run: cargo bench --workspace --no-run --locked

  miri:
    # Checks every `unsafe` block for undefined behavior (CLAUDE.md §3).
    runs-on: ubuntu-24.04
    env:
      # Isolation is disabled only because proptest reads the working directory.
      MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly with Miri
        run: rustup toolchain install nightly --profile minimal --component miri,rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo +nightly miri setup
      # Every module containing `unsafe`, plus the allocation tests that exercise the allocator.
      - run: "cargo +nightly miri test -p bowst-core --lib -- ring::"
      - run: cargo +nightly miri test -p bowst-core --test no_alloc

  fuzz:
    # Short fuzzing run of every target on every PR. Malformed venue data must return an
    # error, never panic (CLAUDE.md §4). Seeds are real recorded messages in fuzz/seeds/.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-fuzz
      - name: Fuzz each target for 60 seconds
        run: |
          for target in $(cargo +nightly fuzz list); do
            mkdir -p "fuzz/corpus/$target"
            # Explicit target: the prebuilt cargo-fuzz binary defaults to its own (musl) target.
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu \
              "$target" "fuzz/corpus/$target" "fuzz/seeds/$target" \
              -- -max_total_time=60
          done

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-deny,cargo-audit
      - run: cargo deny check
      - run: cargo audit
